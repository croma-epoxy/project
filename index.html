<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación MR1 - Invernadero Autónomo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pucv: { navy: '#0F2C59', blue: '#1E3A8A', gold: '#D97706', light: '#F8FAFC' },
            agri: { green: '#15803D', emerald: '#10B981', lime: '#84CC16', alert: '#DC2626' }
          },
          fontFamily: {
            heading: ['Montserrat', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-between overflow-x-hidden select-none">

  <!-- BARRA SUPERIOR -->
  <header class="w-full bg-slate-950/80 backdrop-blur border-b border-slate-800 px-6 py-2 flex items-center justify-between z-50 text-white text-xs md:text-sm">
    <div class="flex items-center space-x-3">
      <span class="inline-block w-3 h-3 rounded-full bg-agri-emerald animate-pulse"></span>
      <span class="font-heading font-bold tracking-wide text-slate-200">PUCV • EIE • LabSens</span>
      <span class="text-slate-500">|</span>
      <span class="text-slate-400 font-mono hidden md:inline">MR1: Arquitectura, Persistencia y Dashboard</span>
    </div>
    <div class="flex items-center space-x-4 bg-slate-900 px-4 py-1 rounded-full border border-slate-700">
      <span class="text-slate-400 text-xs">Tiempo:</span>
      <span id="timerDisplay" class="font-mono font-bold text-base text-agri-emerald">00:00</span>
      <button onclick="toggleTimer()" id="btnTimerToggle" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded">Iniciar</button>
      <button onclick="resetTimer()" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded">Reset</button>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="togglePresenterNotes()" class="px-3 py-1 bg-pucv-blue hover:bg-blue-800 rounded font-medium transition text-xs">🎙️ Guion Orador</button>
      <button onclick="toggleFullscreen()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded font-medium transition text-xs">⛶ Pantalla Completa</button>
    </div>
  </header>

  <!-- LIENZO PRINCIPAL -->
  <main class="flex-1 w-full max-w-7xl p-4 flex items-center justify-center relative">
    <div id="slideViewport" class="slide-container w-full bg-white rounded-2xl relative flex flex-col justify-between overflow-hidden border border-slate-200 transition-all duration-300">
      <div id="slideContent" class="w-full h-full p-8 md:p-10 flex flex-col justify-between overflow-y-auto custom-scrollbar"></div>
      
      <!-- Regla LabSens: Número en extremo inferior derecho -->
      <div class="absolute bottom-4 right-8 font-heading font-bold text-slate-400 text-sm md:text-base tracking-widest pointer-events-none">
        <span id="slideNumberBadge">1</span>
      </div>
    </div>
  </main>

  <!-- BARRA INFERIOR -->
  <footer class="w-full bg-slate-950/80 backdrop-blur border-t border-slate-800 px-6 py-2.5 flex items-center justify-between text-white text-xs md:text-sm">
    <div class="text-slate-400 flex items-center space-x-2">
      <span id="currentSlideTitle" class="text-slate-300 font-medium truncate max-w-xs">Portada Formal</span>
    </div>
    <div class="flex items-center space-x-4">
      <button onclick="prevSlide()" class="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition">◀ Anterior</button>
      <span class="font-mono text-slate-300 font-bold px-2"><span id="navCurrentSlide">1</span> / <span id="navTotalSlides">9</span></span>
      <button onclick="nextSlide()" class="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition">Siguiente ▶</button>
    </div>
  </footer>

  <!-- PANEL DE NOTAS -->
  <aside id="speakerNotesDrawer" class="fixed right-0 top-12 bottom-12 w-full max-w-md bg-slate-900/95 backdrop-blur-xl border-l border-slate-700 shadow-2xl p-6 z-40 transform translate-x-full transition-transform duration-300 flex flex-col text-slate-200">
    <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
      <h3 class="font-heading font-bold text-white text-base">🎙️ Guion y Pauta</h3>
      <button onclick="togglePresenterNotes()" class="text-slate-400 hover:text-white text-xl">✕</button>
    </div>
    <div class="flex-1 overflow-y-auto custom-scrollbar space-y-4 text-sm leading-relaxed">
      <div class="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800">
        <h4 class="text-xs font-bold uppercase tracking-wider text-agri-emerald mb-1">Guion sugerido:</h4>
        <p id="noteScript" class="text-slate-300 italic font-sans"></p>
      </div>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
